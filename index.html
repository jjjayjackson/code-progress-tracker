<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Development Log</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="track" id="track"></div>
    <div class="sheet" id="sheet" aria-hidden="true">
      <div class="sheet-label" id="sheet-label">+</div>
      <div class="composer" id="composer" inert>
        <div class="project-head">
          <input class="stamp" id="version-stamp" type="text" readonly tabindex="-1" aria-label="Created" hidden />
          <textarea class="version-title" id="version-title" placeholder="title" aria-label="Title"></textarea>
        </div>
        <div id="entries"></div>
        <button type="button" class="add-file" id="add-file" aria-label="Add file">+</button>
      </div>
      <div class="sheet-actions">
        <button type="button" class="save" id="save-project">Save</button>
        <button type="button" class="close" id="close-project" aria-label="Close project">×</button>
      </div>
    </div>
    <script src="vendor/supabase.js"></script>
    <script src="supabase-config.js"></script>
    <script src="sync.js"></script>
    <script src="script.js"></script>
  </body>
</html>
